name: bench

# Manual only. Runs a script under tests/qt/measure on the x86_64 runner (the QVariant split against the typed
# template by default, spec_bench/run.sh for the two bindings of the regenerated spec). Shared runners are noisy, so the output is a record to read next to the aarch64 numbers
# in docs/measurements.md, not a gate.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions of every timing
        default: '7'
      script:
        description: Benchmark script under tests/qt/measure
        default: observable_bench/run.sh

permissions:
  contents: read

env:
  IMAGE: reflect-moc/gcc16-qt610

jobs:
  observable-bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Benchmark
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          case "$SCRIPT" in *..*|/*) echo "bad script path"; exit 1;; esac
          docker run --rm -e RQT_RUNS=${{ inputs.runs }} -v "$PWD":/src:ro -w /src "$IMAGE" \
            bash "tests/qt/measure/$SCRIPT" | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt
