name: bench

# Manual only. Runs tests/qt/measure/observable_bench/run.sh on the x86_64 runner: the QVariant split against
# the typed template. Shared runners are noisy, so the output is a record to read next to the aarch64 numbers
# in docs/measurements.md, not a gate.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions of every timing
        default: '7'

permissions:
  contents: read

env:
  IMAGE: reflect-moc/gcc16-qt610

jobs:
  observable-bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: QVariant split against typed signals
        run: |
          docker run --rm -e RQT_RUNS=${{ inputs.runs }} -v "$PWD":/src:ro -w /src "$IMAGE" \
            bash tests/qt/measure/observable_bench/run.sh | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: observable-bench
          path: bench.txt
